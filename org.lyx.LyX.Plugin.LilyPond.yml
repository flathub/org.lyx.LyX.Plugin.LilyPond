id: org.lyx.LyX.Plugin.LilyPond
runtime: org.lyx.LyX
runtime-version: stable
sdk: org.kde.Sdk//6.10
build-extension: true
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.texlive
build-options:
  prefix: /app/plugins/LilyPond
  append-path: /app/plugins/LilyPond/bin
  append-ld-library-path: /app/plugins/LilyPond/lib
  append-pkg-config-path: /app/plugins/LilyPond/lib/pkgconfig
cleanup:
  - /app/plugins/LilyPond/share/man
  - /app/plugins/LilyPond/include
modules:
  - name: gc #guile
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/ivmai/bdwgc.git
        tag: v8.2.12
        commit: 4fab5386df64466b2b61fc7209bef033cad1e6cc
        
  - name: guile
    buildsystem: autotools
    config-opts:
      - --disable-docs
      #- --with-includes=/app/Extensions/include
      #- --with-libraries=/app/Extensions/lib
    # build-options:
      # cflags: -std=gnu17
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/guile/guile-3.0.11.tar.xz
        sha256: 818c79d236657a7fa96fb364137cc7b41b3bdee0d65c6174ca03769559579460
        
  - name: fontforge
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DENABLE_DOCS=false
      - -DENABLE_LIBSPIRO=false
      - -DREAL_TYPE=double
      - -DCMAKE_INCLUDE_PATH=/app/plugins/LilyPond/include
    sources:
      - type: archive
        url: https://github.com/fontforge/fontforge/releases/download/20251009/fontforge-20251009.tar.xz
        sha256: 69046500185a5581b58139dfad30c0b3d8128f00ebbfddc31f2fcf877e329e52
      
  - name: lilypond
    buildsystem: autotools
    config-opts: 
      - --disable-documentation
      - --enable-cairo-backend
    build-options:
      arch:
        aarch64:
          prepend-path: /usr/lib/sdk/texlive/bin/aarch64-linux:/usr/lib/sdk/texlive/bin
        x86_64:
          prepend-path: /usr/lib/sdk/texlive/bin/x86_64-linux:/usr/lib/sdk/texlive/bin
    post-install: 
      - install -Dm644 --target-directory=${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: archive
        url: https://lilypond.org/download/sources/v2.26/lilypond-2.26.0.tar.gz
        sha256: bbe82dbeba7f7f99ddcd8d1fa134a0d89cafa6e8f815fde5bb01f4208b06fe05
      - type: file
        path: org.lyx.LyX.Plugin.LilyPond.metainfo.xml 

  - name: fonts
    buildsystem: simple
    build-commands:
      - cp *.otf /app/plugins/LilyPond/share/lilypond/2.26.0/fonts/otf/
      - cp *.svg /app/plugins/LilyPond/share/lilypond/2.26.0/fonts/svg/
      - cp *.woff /app/plugins/LilyPond/share/lilypond/2.26.0/fonts/svg/
    sources:
      - type: archive #gonville
        url: https://www.chiark.greenend.org.uk/~sgtatham/gonville/gonville-20231028.4ec6d4f.tar.gz
        sha256: b2423c6cc8715353812f5be5a87d3cf230ef0987479e80454084c8829d7e803a
